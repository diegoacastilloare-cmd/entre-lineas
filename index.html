<html lang="es"><head><meta charset="utf-8">

<title>Entre Líneas</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0d0820;--fg:#f5f0ff;--card:#1a1233;--ac:#a78bfa;--ac2:#ff3ea5;--cy:#22e6ff;--mut:#a79fc4;--bd:#3a2c66;--ok:#34d399;--bad:#f87171}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:2rem;margin:.2em 0;text-shadow:0 0 12px var(--ac2),0 0 26px var(--cy)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:10px}
button.p{background:linear-gradient(90deg,var(--ac2),#7c3aed);color:#fff;border:0;font-weight:700;width:100%;padding:14px;box-shadow:0 0 18px #ff3ea566;margin-top:8px}
.hud{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sel{border:2px solid var(--cy);font-weight:700}
.stage{position:relative;height:310px;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(var(--card),var(--bg) 60%)}
.beam{position:absolute;top:-60px;width:90px;height:400px;transform-origin:top center;opacity:.28;filter:blur(6px);animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.ball{position:absolute;top:0;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:repeating-conic-gradient(#fff 0 12deg,#9aa 12deg 24deg);box-shadow:0 0 28px #fff8}
.floor{position:absolute;left:0;right:0;bottom:0;height:80px;background:repeating-linear-gradient(90deg,#ff3ea5 0 16.6%,#22e6ff 16.6% 33.3%,#a78bfa 33.3% 50%);opacity:.35;animation:fl .6s steps(2) infinite}
@keyframes fl{50%{filter:hue-rotate(120deg)}}
.crowd{position:absolute;bottom:60px;width:26px;height:56px;border-radius:13px 13px 4px 4px;background:#08051a;animation:bob .625s ease-in-out infinite alternate}
.crowd:before{content:"";position:absolute;top:-16px;left:3px;width:20px;height:20px;border-radius:50%;background:#08051a}
@keyframes bob{to{transform:translateY(-7px)}}
.who{position:absolute;bottom:14px;transition:left 1s cubic-bezier(.2,.8,.2,1)}

.fl{position:absolute;font-size:1.5rem;animation:rise 1.5s forwards;z-index:5;pointer-events:none}
@keyframes rise{to{transform:translateY(-130px);opacity:0}}
.room{background:linear-gradient(var(--w1),var(--w2))}
.led{position:absolute;top:8px;left:0;right:0;height:5px;background:linear-gradient(90deg,#ff3ea5,#22e6ff,#a78bfa,#ff3ea5);background-size:200%;animation:ld 3s linear infinite;box-shadow:0 0 14px #ff3ea5}
@keyframes ld{to{background-position:200%}}
.rf{position:absolute;bottom:0;left:0;right:0;height:60px;background:#0006}
.bed{position:absolute;bottom:50px;right:4%;width:30%;height:44px;border-radius:8px;background:#e2e8f0aa}
.win{position:absolute;top:30px;left:6%;width:70px;height:80px;border:4px solid #fff7;border-radius:8px;background:#0b1130}.win:after{content:"";position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 4px 0 0 #fde68a}
.pst{position:absolute;border-radius:4px;border:3px solid #0006;box-shadow:0 0 14px #0006}.shf{position:absolute;left:68%;top:118px;width:24%;height:0;border-top:6px solid}
.bub{background:#fff;color:#1c1530;border-radius:14px;padding:10px;margin:10px 0}.bub.me{background:#d9f99d}
.meter{height:12px;background:#0008;border-radius:9px;overflow:hidden;border:1px solid var(--bd);flex:1}
.meter i{display:block;height:100%;transition:width .5s,background .5s}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;font-size:1.02rem}
